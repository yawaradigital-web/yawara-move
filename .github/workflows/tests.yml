name: Sandbox tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      MOVE_DB: /tmp/yawara-move-actions.sqlite3
      MOVE_STORAGE_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests/
      - name: Verify JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/s4.js
          node --check app/static/explore.js
          node --check app/static/map-explore.js
          node --check app/static/place-search.js