<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071820"><title>Yawara Live — Tela Compacta</title><style>
:root{font-family:Inter,Arial,system-ui,sans-serif;color:#effaf8;background:#061920;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:linear-gradient(145deg,#0b3236,#07151f 70%)}#app{width:100%;height:100%;display:flex;flex-direction:column;padding:6px 8px;gap:5px;position:relative;overflow:hidden}#app:before{position:absolute;inset:0;content:"";pointer-events:none;background:radial-gradient(ellipse at 70% -20%,#34b8a521,transparent 58%)}.brand{z-index:1;display:flex;justify-content:space-between;align-items:center;min-height:21px;gap:5px}.logo{font-size:clamp(10px,3.5vw,16px);font-weight:950;letter-spacing:-.5px;white-space:nowrap}.logo em{color:#5fe4c6;font-style:normal}.label{font-size:clamp(7px,2.1vw,10px);color:#7de8d6;font-weight:800;white-space:nowrap}.scoreboard{z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 19px minmax(0,1fr);gap:5px;align-items:center;min-height:73px;flex:0 0 auto}.team{min-width:0;border:1px solid #3c6467;border-radius:9px;background:#0d3239;padding:6px 2px;text-align:center}.team h2{margin:0;font-size:clamp(9px,2.8vw,15px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team strong{font-size:clamp(23px,8vw,38px);display:block;line-height:1.1;font-variant-numeric:tabular-nums}.versus{text-align:center;font-weight:900;color:#5be3ca;font-size:11px}.rankings{z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;min-height:0;flex:1}.column{border:1px solid #2c5259;border-radius:9px;background:#0b252c;min-width:0;overflow:hidden;padding:4px;display:flex;flex-direction:column;gap:4px}.head{font-size:clamp(8px,2.3vw,12px);font-weight:800;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.group{min-height:0;flex:1;overflow:hidden}.group h3{margin:0 0 4px;color:#69e5cc;font-size:clamp(8px,2.3vw,11px);border-bottom:1px solid #315a5f;padding-bottom:3px}.person{display:flex;align-items:center;gap:4px;margin:2px 0;min-width:0}.avatar{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#205b5e;font-weight:900;font-size:8px}.info{min-width:0;flex:1}.info b,.info small{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.info b{font-size:clamp(7px,2vw,10px)}.info small{font-size:clamp(6px,1.65vw,9px);color:#b0cdd0}.empty{font-size:clamp(7px,1.9vw,10px);color:#91acae}.footer{z-index:1;text-align:center;color:#69edcf;font-size:clamp(7px,2.5vw,11px);font-weight:900;letter-spacing:.3px;flex:0 0 auto;padding:3px 0}.status{position:absolute;top:22px;right:8px;font-size:8px;color:#8db6ba;opacity:.9}.badge{border:1px solid #337169;border-radius:5px;padding:2px 4px;font-size:7px}body[data-mode="compact"] .column{gap:2px}body[data-mode="compact"] .scoreboard{min-height:60px}body[data-mode="compact"] .group h3{margin-bottom:3px}body[data-mode="compact"] .person{margin:1px 0}
@media(max-height:240px){.scoreboard{min-height:46px}.group .person:nth-of-type(n+3){display:none}.brand{min-height:16px}.footer{padding:0}.column{gap:1px}}
@media(min-width:550px) and (min-height:600px){#app{max-width:900px;margin:auto;padding:20px;gap:14px}.scoreboard{min-height:160px}.column{padding:18px;gap:15px}.group h3{font-size:20px}.person{gap:10px;margin:8px 0}.avatar{width:35px;height:35px;font-size:13px}.info b{font-size:16px}.info small{font-size:13px}.head{font-size:22px}.brand{min-height:35px}.logo{font-size:24px}.label{font-size:15px}.team h2{font-size:20px}.team strong{font-size:65px}.footer{font-size:16px}}
</style></head><body data-mode="compact"><main id="app"><div class="brand"><div class="logo">YAWARA <em>LIVE</em></div><div class="label">LIVEX1 · AO VIVO</div></div><div class="scoreboard"><div class="team"><h2 id="clubA">SÃO PAULO</h2><strong id="scoreA">0</strong></div><span class="versus">X</span><div class="team"><h2 id="clubB">CORINTHIANS</h2><strong id="scoreB">0</strong></div></div><div class="rankings"><div class="column"><div class="head" id="titleA">SÃO PAULO</div><div class="group"><h3>👑 DIRETORIA</h3><div id="directorsA" class="empty">Aguardando presentes</div></div><div class="group"><h3>📣 TORCIDA</h3><div id="supportersA" class="empty">Aguardando engajamento</div></div></div><div class="column"><div class="head" id="titleB">CORINTHIANS</div><div class="group"><h3>👑 DIRETORIA</h3><div id="directorsB" class="empty">Aguardando presentes</div></div><div class="group"><h3>📣 TORCIDA</h3><div id="supportersB" class="empty">Aguardando engajamento</div></div></div></div><div class="footer" id="footer">CURTA · COMPARTILHE · APOIE SEU CLUBE</div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),qs=new URLSearchParams(location.search);const names={'sao-paulo':'São Paulo',corinthians:'Corinthians',palmeiras:'Palmeiras',flamengo:'Flamengo',santos:'Santos',vasco:'Vasco'};const boardRoles=['Presidente','Vice-presidente','Diretor de Futebol','Técnico'],fanRoles=['Líder da Torcida','Vice-líder','Organizador','Camisa 12'];const demo=qs.get('demo')==='1',match=qs.get('match');const storageKey='yawara-live-clubs-demo';
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
function paintPeople(box,list,roles,key){box.replaceChildren();if(!list.length){box.append(node('div','Aguardando participantes','empty'));return}list.slice(0,3).forEach(([id,u],i)=>{const row=node('div','','person'),avatar=node('div',id.slice(0,2).toUpperCase(),'avatar'),info=node('div','','info');info.append(node('b','@'+id),node('small',roles[i]||'Participante'));row.append(avatar,info);box.append(row)})}
function rankings(users,t,key){return Object.entries(users).filter(([,u])=>u.team===t&&Number(u[key])>0).sort((a,b)=>b[1][key]-a[1][key]||Number(a[1][key+'Reached']||0)-Number(b[1][key+'Reached']||0))}
function showLocal(s){if(!s)return;const users=s.users||{};for(const t of ['A','B']){const raw=s.clubs?.[t==='A'?0:1],name=names[raw]||raw||'Clube '+t;$('club'+t).textContent=name.toUpperCase();$('title'+t).textContent=name.toUpperCase();const score=Object.values(users).filter(x=>x.team===t).reduce((v,x)=>v+Number(x.fanPoints||0)+Number(x.giftPoints||0),0);$('score'+t).textContent=score.toLocaleString('pt-BR');paintPeople($('directors'+t),rankings(users,t,'giftPoints'),boardRoles,'giftPoints');paintPeople($('supporters'+t),rankings(users,t,'fanPoints'),fanRoles,'fanPoints')}$('footer').textContent='CURTA · COMPARTILHE · APOIE SEU CLUBE'}
async function showServer(){if(!/^[0-9a-f-]{36}$/i.test(match||''))return;try{const u='https://zfogohlynxcodrxymuqr.supabase.co/rest/v1/yl_public_scoreboards?select=club_a_name,club_b_name,score_a,score_b,status&match_id=eq.'+encodeURIComponent(match);const response=await fetch(u,{headers:{apikey:'sb_publishable_OcWYvYpAItmDbhz5nbEOYw_GEUE4aN5'},cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const rows=await response.json(),d=rows[0];if(!d)return;for(const [t,n,s] of [['A',d.club_a_name,d.score_a],['B',d.club_b_name,d.score_b]]){$('club'+t).textContent=n.toUpperCase();$('title'+t).textContent=n.toUpperCase();$('score'+t).textContent=Number(s).toLocaleString('pt-BR')}const rankUrl='https://zfogohlynxcodrxymuqr.supabase.co/rest/v1/yl_public_rankings?select=side,kind,position,alias,points&match_id=eq.'+encodeURIComponent(match)+'&order=position.asc';const rr=await fetch(rankUrl,{headers:{apikey:'sb_publishable_OcWYvYpAItmDbhz5nbEOYw_GEUE4aN5'},cache:'no-store'});if(rr.ok){const rankings=await rr.json();for(const t of ['A','B'])for(const [kind,box,roles] of [['gift','directors'+t,boardRoles],['fan','supporters'+t,fanRoles]]){const listed=rankings.filter(x=>x.side===t&&x.kind===kind).slice(0,3).map(x=>[x.alias,{giftPoints:x.points,fanPoints:x.points}]);paintPeople($(box),listed,roles,kind==='gift'?'giftPoints':'fanPoints')}}else for(const id of ['directorsA','directorsB','supportersA','supportersB'])$(id).textContent='Ranking indisponível';$('footer').textContent='PLACAR '+d.status.toUpperCase()+' · LIVEX1'}catch{$('footer').textContent='SEM CONEXÃO · TENTANDO NOVAMENTE'}}
function sample(){const users={};for(const team of ['A','B'])for(let i=0;i<3;i++)users[team+i]={team,giftPoints:i<2?(3-i)*75:0,fanPoints:(3-i)*55,giftPointsReached:i,fanPointsReached:i};return {clubs:['sao-paulo','corinthians'],users}}
function update(){if(match){showServer();return}try{const data=localStorage.getItem(storageKey);if(data)showLocal(JSON.parse(data));else if(demo)showLocal(sample());else $('footer').textContent='ABRA O PAINEL PARA INICIAR'}catch{$('footer').textContent='ERRO NOS DADOS DO PAINEL'}}
update();setInterval(update,2500);
})();
</script></body></html>
